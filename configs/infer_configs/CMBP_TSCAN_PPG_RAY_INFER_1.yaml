BASE: ['']
TOOLBOX_MODE: "RAY_LOO_TEST"      # "train_and_test"  or "only_test"
FOLD: 1
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 50
  LR: 1.0
  USE_LR_FINDER: False
  MODEL_FILE_NAME: CMBP_CMBP_CMBP_TSCAN_RAY_MSE_EARLY
  DATA:
    FS: 25
    DATASET: CMBP
    DO_PREPROCESS: False # if first time, should be true
    DATA_FORMAT: NDCHW
    DATA_PATH: "/data/rppg_23_bi_video_nt_lab/data/"                     # Raw dataset path, need to be updated
#    CACHED_PATH: "/data/rppg_23_bi_video_nt_lab/data_processed/"    # Processed dataset save path, need to be updated
    CACHED_PATH: "/vol/rPPG/loss-functions/"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE: [ 'DiffNormalized','Standardized' ]
      DATA_AUG: [ 'None' ]    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 1500
      CROP_FACE:
        DO_CROP_FACE: False
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 36
        W: 36

TEST:
  METRICS: ['MAE','RMSE','MAPE','Pearson','SNR']
  USE_LAST_EPOCH: False # to use provided validation dataset to find the best epoch, should be false
  OUT_SAVE_DIR: "/vol/rPPG/loss-functions/Tscan/TorchTrainer_2024-12-31_01-58-35/4fa71d21_41_dropout_rate1=0.2000,dropout_rate2=0.1000,epochs=50,lr=0.0000,weight_decay=0.0010_41_dropout_rate1=0.2000,dropout_rate_2024-12-31_03-53-42"
  DATA:
    FS: 25
    DATASET: CMBP
    DO_PREPROCESS: False # if first time, should be true
    DATA_FORMAT: NDCHW
    DATA_PATH: "/data/rppg_23_bi_video_nt_lab/processed"                     # Raw dataset path, need to be updated
#    CACHED_PATH: "/data/rppg_23_bi_video_nt_lab/rppg_processed"    # Processed dataset save path, need to be updated
    CACHED_PATH: "/vol/rPPG/loss-functions/"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.9
    END: 1.0
    PREPROCESS:
      DATA_TYPE: [ 'DiffNormalized','Standardized' ]
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 1500
      CROP_FACE:
        DO_CROP_FACE: False
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 36
        W: 36
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  LOSS: "MSE"
  DROP_RATE: 0.2
  OPTIMIZE_DROP_RATE: True
  NAME: Tscan
  SCHEDULER: None
  TSCAN:
    FRAME_DEPTH: 10
#  MODEL_DIR: "/data/rppg_23_bi_video_nt_lab/rppg_processed/Models"    # Processed dataset save path, need to be updated
  MODEL_DIR: "/vol/rPPG/models/"    # Processed dataset save path, need to be updated


INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "Welch"        # "FFT" or "peak detection"
  MODEL_PATH:   "/vol/rPPG/loss-functions/Tscan/TorchTrainer_2024-12-31_01-58-35/4fa71d21_41_dropout_rate1=0.2000,dropout_rate2=0.1000,epochs=50,lr=0.0000,weight_decay=0.0010_41_dropout_rate1=0.2000,dropout_rate_2024-12-31_03-53-42/checkpoint_000048/checkpoint.ckpt"