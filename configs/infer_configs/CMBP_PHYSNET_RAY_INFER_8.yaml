BASE: ['']
TOOLBOX_MODE: "RAY_LOO_TEST"      # "train_and_test"  or "only_test"
FOLD: 8
TRAIN:
  BATCH_SIZE: 32
  EPOCHS: 50
  LR: 1e-4
  USE_LR_FINDER: False
  MODEL_FILE_NAME: CMBP_CMBP_CMBP_physnet_loo_raw_standardized
  DATA:
    FS: 25
    DATASET: CMBP
    DO_PREPROCESS: False # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/data/rppg_23_bi_video_nt_lab/data/"                     # Raw dataset path, need to be updated
#    CACHED_PATH: "/data/rppg_23_bi_video_nt_lab/data_processed/"    # Processed dataset save path, need to be updated
    #DATA_PATH: "/data/rppg_23_bi_video_nt_lab/processed"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/vol/rPPG/loss-functions/"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      USE_PSUEDO_PPG_LABEL: True
      DATA_TYPE: ['Raw']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      CROP_FACE:
        DO_CROP_FACE: True
        USE_LARGE_FACE_BOX: False
        LARGE_BOX_COEF: 1.0
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 1
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE','RMSE','MAPE','Pearson', 'SNR']
  USE_LAST_EPOCH: False # to use provided validation dataset to find the best epoch, should be false
  OUT_SAVE_DIR: "/vol/rPPG/loss-functions/Physnet/TorchTrainer_2025-01-23_14-59-53/97e3f8ce_79_epochs=50,lr=0.0000,weight_decay=0.0010_79_epochs=50,lr=0.0000,weight_decay=0.0010_2025-01-25_23-56-26"
  DATA:
    FS: 25
    DATASET: CMBP
    DO_PREPROCESS: False # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/data/rppg_23_bi_video_nt_lab/data/"                     # Raw dataset path, need to be updated
#    CACHED_PATH: "/data/rppg_23_bi_video_nt_lab/data_processed/"    # Processed dataset save path, need to be updated
    CACHED_PATH: "/vol/rPPG/loss-functions/"    # Processed dataset save path, need to be updated
    #DATA_PATH: "/data/rppg_23_bi_video_nt_lab/processed"                     # Raw dataset path, need to be updated
    #CACHED_PATH: "/vol/rPPG/physnetData/"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.9
    END: 1.0
    PREPROCESS:
      DATA_TYPE: [ 'Raw']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      CROP_FACE:
        DO_CROP_FACE: True
        USE_LARGE_FACE_BOX: False
        LARGE_BOX_COEF: 1.0
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 1
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: Physnet
  MODEL_DIR: "/vol/rPPG/models/"    # Processed dataset save path, need to be updated
  LOSS: "MSE"
  PHYSNET:
    FRAME_NUM: 128
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "Welch"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH:   "/vol/rPPG/loss-functions/Physnet/TorchTrainer_2025-01-23_14-59-53/97e3f8ce_79_epochs=50,lr=0.0000,weight_decay=0.0010_79_epochs=50,lr=0.0000,weight_decay=0.0010_2025-01-25_23-56-26/checkpoint_000030/checkpoint.ckpt"
